# /etc/nginx/conf.d/default.conf
#
# One address for every page: https://mediana-research.com
#   http://…, http://www.…, https://www.…  → 301 → https://mediana-research.com…
#   any other host name (bare IP and so on) → connection closed, so no duplicates get indexed.
# The site itself is the FastAPI app (mediana.service) on 127.0.0.1:8080.

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mediana-research.com;

    ssl_certificate /etc/letsencrypt/live/mediana-research.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mediana-research.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8080;  # no trailing slash: the URI goes to the app unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# https://www → https://mediana-research.com (the certificate covers both names)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mediana-research.com;

    ssl_certificate /etc/letsencrypt/live/mediana-research.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediana-research.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mediana-research.com$request_uri;
}

# http, both names → https://mediana-research.com in one hop
server {
    listen 80;
    listen [::]:80;
    server_name mediana-research.com www.mediana-research.com;

    # Let's Encrypt HTTP check, should certbot renew over webroot
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://mediana-research.com$request_uri;
    }
}

# Unknown host names: drop
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;  # nginx ≥ 1.19.4
}
